<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>パスワードの再設定</title>
<link rel="stylesheet" href="/auth.css">
</head>
<body>
<main class="card">
    <h1>パスワードの再設定</h1>
    <p class="lead">登録のときに決めた「キーワード」で、パスワードを再設定します。キーワードを 3 回続けて間違えると、8 時間、再設定できなくなります（ログインは、そのままできます）。</p>
    <form id="form" novalidate>
        <label for="email">メールアドレス</label>
        <input id="email" name="email" type="email" autocomplete="username" required>
        <label for="keyword">キーワード</label>
        <input id="keyword" name="keyword" type="text" autocomplete="off" required>
        <label for="next">新しいパスワード</label>
        <input id="next" name="next" type="password" autocomplete="new-password" minlength="8" required>
        <p class="hint">8 文字以上、128 文字以内</p>
        <button id="submit" type="submit">再設定する</button>
        <p id="err" class="err" role="alert"></p>
        <p id="done" class="alt" style="color:#4ade80"></p>
    </form>
    <p class="alt"><a href="/login.html">ログインにもどる</a></p>
</main>
<script src="/jhtml.browser.js"></script>
<script>
    const { $, on, api, form } = jhtml;
    on($('form'), 'submit', async (e) => {
        e.preventDefault();
        const btn = $('submit'), err = $('err');
        err.textContent = '';
        btn.disabled = true;
        try {
            await api.post('/api/reset', form($('form')));
            $('done').innerHTML = 'パスワードを再設定しました。<a href="/login.html">ログイン</a>してください。';
        } catch (ex) {
            err.textContent = ex.data?.errors?.map((x) => x.message).join('\n') || ex.message;
            btn.disabled = false;
        }
    });
</script>
</body>
</html>
